name: tests
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    # A public repository must not run pull requests on the shared Hetzner runner:
    # anyone who opens one could execute code there, and that runner user can reach
    # root through docker. Hosted minutes are free for public repositories.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Create a workspace virtualenv
        run: python3 -m venv .venv
      - name: Install project and pytest
        run: |
          . .venv/bin/activate
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pytest
      - name: Run tests
        run: |
          . .venv/bin/activate
          if [ ! -d tests ]; then echo 'no tests directory on this ref, nothing to run'; exit 0; fi
          pytest -q
